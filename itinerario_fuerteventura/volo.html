<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0F5C63">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Fuerteventura 2026 — Volo</title>
    <link rel="stylesheet" href="style_itinerario.css">
    <link rel="stylesheet" href="style_itinerario_dark.css" id="darkModeStyles" disabled>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="page-volo">
    <div class="trip">
        <header class="trip-header">
            <button class="dark-mode-toggle" id="darkModeToggle" aria-label="Toggle dark mode">
                <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"/>
                    <line x1="12" y1="1" x2="12" y2="3"/>
                    <line x1="12" y1="21" x2="12" y2="23"/>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                    <line x1="1" y1="12" x2="3" y2="12"/>
                    <line x1="21" y1="12" x2="23" y2="12"/>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                </svg>
                <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
            <div class="trip-header__eyebrow">
                <span>11—18 Agosto 2026</span>
            </div>
            <h1 class="trip-header__title">Informazioni Volo</h1>
            <div class="trip-header__meta">
                <span><strong>✈️</strong> Andata e Ritorno</span>
            </div>
        </header>

        <main class="timeline flight-cards-container" style="margin-top: 20px">
            <div class="flight-card flight-card--departure">
                <div class="flight-card__header">
                    <div class="flight-card__icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>
                        </svg>
                    </div>
                    <div class="flight-card__label">Andata</div>
                </div>
                <div class="flight-card__body">
                    <div class="flight-card__time">06:20</div>
                    <div class="flight-card__date">Martedì 11 Agosto 2026</div>
                </div>
            </div>

            <div class="flight-card flight-card--arrival">
                <div class="flight-card__header">
                    <div class="flight-card__icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6.2 4.8 8 13l-3.5 3.5C3 18 2.5 20 3 21c1 .5 3 0 4.5-1.5L11 16l8.2 1.8c.5.1.9-.1 1.1-.5l.3-.5c.2-.5.1-1-.3-1.3L15 12l2-3h3l1-1-3-2-2-3-1 1v3l-3 2-5.3-3.5c-.3-.4-.8-.5-1.3-.3l-.5.2c-.4.3-.6.7-.5 1.2z"/>
                        </svg>
                    </div>
                    <div class="flight-card__label">Ritorno</div>
                </div>
                <div class="flight-card__body">
                    <div class="flight-card__time">10:15</div>
                    <div class="flight-card__date">Martedì 18 Agosto 2026</div>
                </div>
            </div>
        </main>

        <footer class="trip-footer">
            <p>Michael & Alice! 🌊☀️🏝️❤️</p>
        </footer>

        <nav class="fixed-footer">
            <a href="itinerario.html" class="fixed-footer__button">🏠</a>
            <a href="ristoranti.html" class="fixed-footer__button">🍽️</a>
            <a href="frasi.html" class="fixed-footer__button">💬</a>
            <a href="volo.html" class="fixed-footer__button active">✈️</a>
        </nav>
    </div>

    <script src="script_itinerario.js"></script>
</body>
</html>
